<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatPME — Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F5F5F7;
        }
        .apple-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="apple-card w-full max-w-sm p-8 rounded-[32px] shadow-[0_20px_40px_rgba(0,0,0,0.04)] text-center">
        <div class="mb-10">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-black text-white rounded-2xl mb-4 shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Administration</h1>
            <p class="text-sm text-gray-500 mt-2 font-medium">Accès sécurisé au panneau de contrôle</p>
        </div>

        <div class="space-y-5">
            <div class="text-left">
                <label for="password" class="block text-[13px] font-medium text-gray-400 ml-1 mb-1.5">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••"
                    class="w-full px-4 py-3 bg-gray-100 border-none rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:ring-2 focus:ring-black/5 transition-all outline-none">
            </div>

            <button id="login-btn" class="w-full py-3 bg-black text-white rounded-xl font-semibold text-sm transition-all hover:bg-gray-800 active:scale-[0.98] shadow-md">
                Se connecter
            </button>

            <div id="error" class="hidden text-red-500 text-xs font-medium animate-shake">
                Mot de passe incorrect
            </div>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('login-btn');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('error');

        loginBtn.onclick = async () => {
            const password = passwordInput.value;
            if (!password) return;

            errorDiv.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerText = 'Connexion...';

            try {
                const res = await fetch('/admin/auth', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('admin_token', data.token);
                    window.location.href = '/admin';
                } else {
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Se connecter';
                }
            } catch (e) {
                errorDiv.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerText = 'Se connecter';
            }
        };

        passwordInput.onkeydown = (e) => {
            if (e.key === 'Enter') loginBtn.click();
        };
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 2;
        }
    </style>
</body>
</html>
